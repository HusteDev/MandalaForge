<!DOCTYPE html>
<html>

<head>
    <title>Sign in · MandalaForge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="static/emblem.svg">
    <style>
        :root {
            --bg-color: #f7f1e6;
            --panel-color: #fffcf6;
            --text-color: #2b2230;
            --text-muted: #6e6168;
            --border-color: #e6d9c3;
            --border-soft: #efe5d4;
            --primary-color: #a8580c;
            --on-gold: #2e1a05;
            --gold-gradient: linear-gradient(180deg, #f8c96a 0%, #e29a2e 100%);
            --gold-gradient-hover: linear-gradient(180deg, #f5bb4c 0%, #cf8418 100%);
            --mandala-gradient: linear-gradient(90deg, #f08519, #e0404d, #c03a9b, #6a4fd3, #2f74d8, #12998a);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--mandala-gradient);
        }

        .login-container {
            background: var(--panel-color);
            padding: 2rem 2.25rem;
            border-radius: 14px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 1px 2px rgba(74, 46, 12, 0.06), 0 10px 30px rgba(74, 46, 12, 0.1);
            text-align: center;
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
        }

        .login-emblem {
            width: 72px;
            height: 72px;
            display: block;
            margin: 0 auto 0.5rem;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .brand-mandala,
        .brand-forge {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .brand-mandala {
            background-image: linear-gradient(90deg, #f08519 0%, #e0404d 30%, #c03a9b 60%, #6a4fd3 85%, #2f74d8 100%);
        }

        .brand-forge {
            background-image: linear-gradient(180deg, #d9891c 0%, #a65a0d 100%);
        }

        .tagline {
            margin: 0 0 1.25rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #e29a2e;
            box-shadow: 0 0 0 3px rgba(226, 154, 46, 0.35);
        }

        button {
            width: 100%;
            padding: 11px 20px;
            border: 1px solid #c98219;
            background-color: #e29a2e;
            background-image: var(--gold-gradient);
            color: var(--on-gold);
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-image: var(--gold-gradient-hover);
        }

        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(226, 154, 46, 0.35);
        }

        .divider {
            margin: 1.25rem 0 0.75rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #error-message {
            color: #b3263a;
            min-height: 1em;
            margin: 0.75rem 0 0;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(74, 46, 12, 0.08);
            font-weight: 500;
        }

        .google-btn:hover {
            background: #fdf1dc;
            border-color: #e29a2e;
        }

        .google-btn .google-icon {
            margin-right: 12px;
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <img class="login-emblem" src="static/emblem.svg" alt="">
        <h1><span class="brand-mandala">Mandala</span><span class="brand-forge">Forge</span></h1>
        <p class="tagline">Sign in to forge your next coloring page</p>
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <button id="loginButton">Sign In</button>
        <p class="divider">or</p>
        <button id="googleLoginButton" class="google-btn">
            <svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" fill-rule="evenodd">
                    <path
                        d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4818h4.8436c-.2086 1.125-.8427 2.0782-1.7772 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.6154z"
                        fill="#4285F4"></path>
                    <path
                        d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.86-3.0477.86-2.344 0-4.3227-1.5831-5.0327-3.7104H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z"
                        fill="#34A853"></path>
                    <path
                        d="M3.9673 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2823-1.71V4.9582H.9574C.3477 6.1732 0 7.5477 0 9c0 1.4523.3477 2.8268.9574 4.0418L3.9673 10.71z"
                        fill="#FBBC05"></path>
                    <path
                        d="M9 3.5795c1.3218 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.425 0 9 0 5.4818 0 2.4382 2.0168.9574 4.9582L3.9673 7.29C4.6773 5.1627 6.656 3.5795 9 3.5795z"
                        fill="#EA4335"></path>
                </g>
            </svg>
            Sign in with Google
        </button>
        <p id="error-message"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>


    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCezR2TsDi8aPEJBVaThm2g2NzWFs1S-Gc",
            authDomain: "husted-dev.firebaseapp.com",
            projectId: "husted-dev",
            storageBucket: "husted-dev.firebasestorage.app",
            messagingSenderId: "181324919557",
            appId: "1:181324919557:web:d84fe89a238848e5847d6c",
            measurementId: "G-YPKDVB819L"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Initialize App Check with reCAPTCHA
        if (typeof firebase.appCheck !== 'undefined') {
            try {
                const appCheck = firebase.appCheck();
                appCheck.activate('6LfdVcArAAAAACsXiZoOZPrmzpt-ifMbZOAFyhTi', true);
                console.log('App Check initialized');
            } catch (error) {
                console.warn('App Check initialization failed:', error);
                // Continue without App Check
            }
        }

        // Get references to the HTML elements
        const loginButton = document.getElementById('loginButton');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');

        // Add a click event listener to the login button
        loginButton.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;

            errorMessage.textContent = ''; // Clear previous errors

            // Use the Firebase auth service to sign in
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // If sign-in is successful, redirect to the main protected page
                    console.log("Sign-in successful, redirecting...");
                    window.location.href = '/'; // Redirect to the root of the site
                })
                .catch((error) => {
                    // If there's an error, display it to the user
                    console.error("Sign-in error:", error);
                    errorMessage.textContent = error.message;
                });
        });

        // Get reference to the new Google login button
        const googleLoginButton = document.getElementById('googleLoginButton');

        // Add a click event listener to the Google login button
        googleLoginButton.addEventListener('click', () => {
            // Create an instance of the Google provider object
            const provider = new firebase.auth.GoogleAuthProvider();

            errorMessage.textContent = ''; // Clear previous errors

            // Sign in with the Google provider using a popup
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    // This gives you a Google Access Token. You can use it to access the Google API.
                    const credential = result.credential;
                    const token = credential.accessToken;
                    // The signed-in user info.
                    const user = result.user;

                    console.log("Google sign-in successful, redirecting...");
                    console.log("User:", user);
                    window.location.href = '/'; // Redirect to the root of the site

                }).catch((error) => {
                    // Handle Errors here.
                    const errorCode = error.code;
                    const errorMessageText = error.message;
                    // The email of the user's account used.
                    const email = error.customData.email;
                    // The AuthCredential type that was used.
                    const credential = firebase.auth.GoogleAuthProvider.credentialFromError(error);

                    console.error("Google sign-in error:", error);
                    errorMessage.textContent = errorMessageText;
                });
            });
    </script>
</body>

</html>
